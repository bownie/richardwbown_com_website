name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_URL: ${{ vars.LINKEDIN_URL || 'https://www.linkedin.com/in/richard-bown/' }}
      BLUESKY_URL: ${{ vars.BLUESKY_URL || 'https://bsky.app/profile/bownie.bsky.social' }}
      # Deployments from main publish the staging site on the project Pages URL
      # (https://bownie.github.io/richardwbown_com_website/). astro.config.mjs
      # derives the base path from this mode, so preview is what keeps generated
      # asset and link URLs under the project path. A production build uses `/`
      # and is only valid once richardwbown.com is the configured custom domain;
      # set the repository variable SITE_MODE=production to build that way.
      SITE_MODE: ${{ github.event_name == 'pull_request' && 'preview' || vars.SITE_MODE || 'preview' }}
      SHOW_TALKS: ${{ vars.SHOW_TALKS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Remove custom domain file from staging builds
        # A CNAME file in the artifact would point this project Pages deployment
        # at richardwbown.com while that domain is still serving the WordPress
        # site, so it is only published from a production build.
        if: env.SITE_MODE != 'production'
        run: rm -f dist/CNAME

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    # The publishing path for richardwbown.com. The Pages job above keeps
    # publishing the staging build to the project Pages URL; this job deploys
    # the Worker in wrangler.jsonc, which serves the apex and www custom
    # domains.
    #
    # SITE_MODE=production is required: astro.config.mjs derives `base` from it,
    # and a preview build emits /richardwbown_com_website/ prefixed asset and
    # link URLs that 404 on the live domain.
    #
    # Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository
    # secrets; the token needs Workers Scripts: Edit (plus Workers Routes: Edit
    # if the routes in wrangler.jsonc are ever changed from CI).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker
      cancel-in-progress: false
    env:
      SITE_MODE: production
      LINKEDIN_URL: ${{ vars.LINKEDIN_URL || 'https://www.linkedin.com/in/richard-bown/' }}
      BLUESKY_URL: ${{ vars.BLUESKY_URL || 'https://bsky.app/profile/bownie.bsky.social' }}
      SHOW_TALKS: ${{ vars.SHOW_TALKS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to wrangler 3, which never loads wrangler.jsonc
          # and fails with "Missing entry-point" because the `main` field is
          # never read. Pin the version that does read it.
          wranglerVersion: "4.165.0"
          command: deploy
